<div class="bg-blobs" aria-hidden="true"></div>
<div id="app">
  <!-- Header: sticky + glass -->
  <header id="appHeader" class="glass-bar fixed top-0 inset-x-0 z-30 px-4 pb-2.5 flex items-center justify-between" style="padding-top:calc(var(--sat) + .6rem)">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-purple-900/50 ring-1 ring-white/20">
        <svg class="ic w-5 h-5"><use href="#i-shield-check"/></svg>
      </div>
      <span class="text-[17px] font-bold tracking-tight text-white">YT Hunter</span>
    </div>
    <button data-act="menu" class="glass-btn w-9 h-9 flex items-center justify-center" aria-label="Menu"><svg class="ic w-5 h-5"><use href="#i-ellipsis"/></svg></button>
  </header>

  <!-- Update pill -->
  <div id="updateBar" class="hidden fixed left-3 right-3 z-30 glass rounded-2xl px-3.5 py-2.5 items-center justify-between gap-2 text-xs" style="top:calc(var(--sat) + 4rem)">
    <span class="font-semibold text-white">Versi baru tersedia</span>
    <button id="btnUpdate" class="px-3.5 py-1.5 rounded-xl bg-brand-600 text-white font-bold active:scale-95">Perbarui</button>
  </div>

  <!-- Views -->
  <main id="main">
    <section id="view-1" class="view scroll hidden"></section>
    <section id="view-2" class="view scroll hidden"></section>
    <section id="view-3" class="view scroll hidden"></section>
    <section id="view-4" class="view scroll hidden"></section>
    <section id="view-5" class="view scroll hidden"></section>
  </main>

  <!-- Bottom nav: glass -->
  <nav class="glass-bar fixed bottom-0 inset-x-0 z-30 grid grid-cols-5" style="padding-bottom:var(--sab);border-top:1px solid rgba(255,255,255,.08);border-bottom:0">
    <button data-act="mod" data-n="1" id="tab-1" class="py-2.5 flex flex-col items-center gap-0.5 text-[10px] font-semibold"><svg class="ic w-5 h-5"><use href="#i-compass"/></svg>Launchpad</button>
    <button data-act="mod" data-n="2" id="tab-2" class="py-2.5 flex flex-col items-center gap-0.5 text-[10px] font-semibold"><svg class="ic w-5 h-5"><use href="#i-file-pen-line"/></svg>Skrip</button>
    <button data-act="mod" data-n="5" id="tab-5" class="py-2.5 flex flex-col items-center gap-0.5 text-[10px] font-semibold"><svg class="ic w-5 h-5"><use href="#i-film"/></svg>Prompt</button>
    <button data-act="mod" data-n="3" id="tab-3" class="py-2.5 flex flex-col items-center gap-0.5 text-[10px] font-semibold"><svg class="ic w-5 h-5"><use href="#i-shield-alert"/></svg>Guard</button>
    <button data-act="mod" data-n="4" id="tab-4" class="py-2.5 flex flex-col items-center gap-0.5 text-[10px] font-semibold"><svg class="ic w-5 h-5"><use href="#i-layers"/></svg>Aset</button>
  </nav>
</div>

<!-- Sheet (modal) -->
<div id="sheetRoot" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center">
  <div id="sheet" class="sheet-in glass-sheet w-full sm:max-w-lg max-h-[92dvh] flex flex-col rounded-t-3xl sm:rounded-2xl shadow-2xl" style="padding-bottom:var(--sab)"></div>
</div>

<!-- Toast -->
<div id="toast" class="glass fixed left-1/2 -translate-x-1/2 z-[60] opacity-0 pointer-events-none transition-all duration-300 translate-y-3 max-w-[92vw] text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2" style="bottom:calc(var(--sab) + 5rem)">
  <svg class="ic w-4 h-4 text-brand-400"><use href="#i-info"/></svg><span id="toastMsg"></span>
</div>

<input type="file" id="importFile" accept="application/json,.json" class="hidden">
